name: Build

# A v* tag push builds, creates the draft release if it is missing, and attaches
# the assets. Run workflow with an empty release_tag only builds (artifacts on
# the run page). The version is __version__ in src/softchord_version.py; a tag
# must be v<that version>. If Apple is still notarizing a DMG after about 10
# minutes, the signed DMG is attached with NAME.dmg.notarization-pending next
# to it; run the Staple workflow later to staple it.
#
# Nothing is built until every test passes: the desktop (Python) and web (Node
# with headless Chrome) tests on Linux, macOS and Windows, and the iOS tests on
# a simulator.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload builds to (e.g. v1.1). Leave empty to skip upload.
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Version and tag
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          VER="$(python3 build_softChord.py --version)"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$INPUT_TAG"
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$VER" ]; then
            echo "::error::Tag $TAG does not match src/softchord_version.py ($VER). Expected v$VER."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Version $VER, tag '${TAG:-none}'"

      - name: Create the draft release if missing
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
            exit 0
          fi
          NOTES="docs/release_notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --draft --verify-tag --title "softChord $VER" --notes-file "$NOTES"
          else
            echo "::warning::$NOTES not found; using generated notes"
            gh release create "$TAG" --draft --verify-tag --title "softChord $VER" --generate-notes
          fi

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # A missing Chrome fails the browser tests instead of skipping them.
      SOFTCHORD_REQUIRE_BROWSER: "1"
    steps:
      # Test files (song text with CRLF) are checked out as committed.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0

      - name: Chrome path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { Write-Error "Chrome not found at $chrome"; exit 1 }
          "CHROME_BIN=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      # Both scripts exit with the unittest result (os._exit), so a crash of
      # Qt while Python shuts down cannot fail a passing run.
      - name: Desktop unit tests
        working-directory: src
        run: python test_song.py

      - name: Desktop integration tests
        working-directory: src
        run: python softchord_test.py

      - name: Web tests
        working-directory: softChord_web
        run: node --test

  test-ios:
    name: Tests (iOS simulator)
    # The app needs iOS 26.4 or newer, so Xcode 26.4 or newer (macOS 26 image).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The repository has no shared scheme; xcodebuild uses the one it
      # creates for the app target. This lists it in the log.
      - name: Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project "softChord Viewer/softChord Viewer.xcodeproj"

      - name: iOS tests
        run: |
          xcodebuild test \
            -project "softChord Viewer/softChord Viewer.xcodeproj" \
            -scheme "softChord Viewer" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO

  build:
    needs: [prepare, test, test-ios]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            id: macos-arm64
            arch: arm64
          - os: macos-15-intel
            id: macos-x86_64
            arch: x86_64
          - os: windows-latest
            id: windows
            arch: x64
          # The oldest supported Ubuntu image: the AppImage needs a glibc at
          # least as new as the one it was built with (2.35 here).
          - os: ubuntu-22.04
            id: linux-x86_64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VER: ${{ needs.prepare.outputs.ver }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1

      - name: Build
        run: python build_softChord.py

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: file dist/softChord.app/Contents/MacOS/softChord

      - name: Sign, package DMG and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/sign_and_package.sh "$VER" "${{ matrix.arch }}"

      - name: Package Windows zip and exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "packaging/windows/How to open softChord on Windows.txt" dist/
          (cd dist && python -m zipfile -c "softChord-$VER-windows.zip" softChord.exe "How to open softChord on Windows.txt")
          python -m zipfile -l "dist/softChord-$VER-windows.zip"
          mv dist/softChord.exe "dist/softChord-$VER-windows.exe"

      - name: Package AppImage and tar.gz (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/package.sh "$VER" "${{ matrix.arch }}"

      # Start the AppImage for 15 s with no screen: a missing library or file
      # stops it before then (timeout's exit code 124 means it was running).
      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            timeout 15 "dist/softChord-$VER-linux-${{ matrix.arch }}.AppImage" 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 124 ] || grep -qE "Traceback|error while loading shared libraries" smoke.log; then
            echo "::error::The AppImage did not keep running (exit $code)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: softChord-${{ matrix.id }}
          path: |
            dist/softChord-${{ env.VER }}-*.dmg
            dist/softChord-${{ env.VER }}-*.zip
            dist/softChord-${{ env.VER }}-*.exe
            dist/softChord-${{ env.VER }}-*.AppImage
            dist/softChord-${{ env.VER }}-*.tar.gz
            dist/softChord-${{ env.VER }}-*.notarization-pending
          if-no-files-found: error

      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/softChord-"$VER"-*.dmg dist/softChord-"$VER"-*.zip dist/softChord-"$VER"-*.exe
                 dist/softChord-"$VER"-*.AppImage dist/softChord-"$VER"-*.tar.gz
                 dist/softChord-"$VER"-*.notarization-pending)
          gh release upload "$TAG" "${files[@]}" --clobber
          # A rebuild that stapled in time drops the pending marker of an earlier run.
          if [ "$RUNNER_OS" = macOS ]; then
            p="softChord-$VER-macos-${{ matrix.arch }}.dmg.notarization-pending"
            [ -f "dist/$p" ] || gh release delete-asset "$TAG" "$p" -y 2>/dev/null || true
          fi
