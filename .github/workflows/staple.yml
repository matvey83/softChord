name: Staple

# Staple the macOS DMGs of a release whose notarization was still pending when
# the Build workflow finished (assets named *.dmg.notarization-pending).
# Accepted DMGs are stapled and re-uploaded; a rejected one fails with Apple's log.
# Locally: tools/release.sh --staple VERSION

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  staple:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Staple pending DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAG: ${{ inputs.tag }}
        run: packaging/macos/staple_release.sh "$TAG"
