<!DOCTYPE html>
<!--
  The README.md in the repository root links to this page
  (https://matvey83.github.io/softChord/softChord_web/). If the address of the
  web app changes, update that link in README.md too, and the repository's
  website field on GitHub.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>softChord Viewer</title>
  <link rel="stylesheet" href="viewer.css?v=2026-10-28d">
  <!-- The app icon (an open songbook with a clef), as in the iOS and desktop apps.
       The 16, 32 and 48 px sizes are cropped to the book with thicker lines. -->
  <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
</head>
<body>
  <main id="list-view">
    <div class="search-bar">
      <label for="search">Search:</label>
      <input id="search" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <p id="list-error" class="error" hidden></p>
    <ul id="song-list"></ul>
  </main>

  <main id="song-view" hidden>
    <header class="toolbar">
      <button id="back" type="button">‹ Back</button>
      <h1 id="song-title"></h1>
      <!-- The toolbar icons are drawn for this app (24 px grid, round stroke,
           currentColor; Up and Down are plain arrows like the SF Symbols arrow.up
           and arrow.down in the iOS app; Zoom out and Zoom in are a magnifying
           glass with a minus, an equals sign (back to 100%) or a plus; Reset transpose is a counterclockwise arrow; Print is a printer; Edit text is a pencil; Edit chords is a note with a pencil; Edit chord is a text field; Delete chord is a bin; Undo and Redo are curved arrows), so they need no licence note or network fetch. -->
      <div class="toolbar-actions">
        <div class="tool-group" role="group" aria-label="Copy song">
          <button id="copy-text" class="tool" type="button" title="Copy song text" aria-label="Copy song text">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 15V5a2 2 0 0 1 2-2h8"/><rect x="8" y="7" width="13" height="15" rx="2"/><path d="M11.5 12h6M11.5 15.5h6M11.5 19h3.5"/></svg>
          </button>
          <button id="copy-chords" class="tool" type="button" title="Copy song text (with chords)" aria-label="Copy song text (with chords)">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 15V5a2 2 0 0 1 2-2h8"/><rect x="8" y="7" width="13" height="15" rx="2"/><circle cx="12.6" cy="18.6" r="1.7"/><path d="M14.3 18.6V11.5l3 1.2"/></svg>
          </button>
          <button id="copy-image" class="tool" type="button" title="Copy song as image" aria-label="Copy song as image">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3.5 17.5 8.5 13l4 3.8 3-2.8 5.5 5"/></svg>
          </button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group" role="group" aria-label="Transpose">
          <button id="transpose-down" class="tool" type="button" title="Transpose down" aria-label="Transpose down">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
          </button>
          <button id="transpose-up" class="tool" type="button" title="Transpose up" aria-label="Transpose up">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M12 20V4M6 10l6-6 6 6"/></svg>
          </button>
          <button id="transpose-reset" class="tool" type="button" title="Reset transpose" aria-label="Reset transpose" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4.6 12a7.4 7.4 0 1 0 2.2-5.2"/><path d="M4.4 3.8v4.4h4.4"/></svg>
          </button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group" role="group" aria-label="Zoom">
          <button id="zoom-out" class="tool" type="button" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21M7.5 10.5h6"/></svg>
          </button>
          <button id="zoom-reset" class="tool" type="button" title="Reset zoom (100%)" aria-label="Reset zoom (100%)">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21M7.5 9h6M7.5 12h6"/></svg>
          </button>
          <button id="zoom-in" class="tool" type="button" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21M7.5 10.5h6M10.5 7.5v6"/></svg>
          </button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group" role="group" aria-label="Print">
          <button id="print" class="tool" type="button" title="Print / Save as PDF" aria-label="Print / Save as PDF">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M7 9V3.5h10V9"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="6.5" rx="1"/><path d="M17.5 12h.01"/></svg>
          </button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group" role="group" aria-label="Edit">
          <button id="edit-text" class="tool" type="button" title="Edit Text…" aria-label="Edit Text…">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 20l1-4.2L16.6 4.2a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.3l3.2 3.2"/></svg>
          </button>
          <button id="edit-chords" class="tool" type="button" title="Edit Chords…" aria-label="Edit Chords…">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="7" cy="17.5" r="2.7"/><path d="M9.7 17.5V4.5l6.3 1.7"/><path d="M13 20.5l.7-3 5.6-5.6a1.5 1.5 0 0 1 2.1 2.1L15.8 19.6z"/></svg>
          </button>
        </div>
        <div id="chord-actions" class="tool-group" role="group" aria-label="Chord" hidden>
          <button id="chord-edit" class="tool" type="button" title="Add chord" aria-label="Add chord" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M12 10v4"/></svg>
          </button>
          <button id="chord-delete" class="tool" type="button" title="Delete chord" aria-label="Delete chord" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13M10.5 11v6M13.5 11v6"/></svg>
          </button>
          <button id="chord-undo" class="tool" type="button" title="Undo" aria-label="Undo" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 8h6a4.5 4.5 0 0 1 0 9H8"/><path d="M12 4.5 8.5 8l3.5 3.5"/></svg>
          </button>
          <button id="chord-redo" class="tool" type="button" title="Redo" aria-label="Redo" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M15 8H9a4.5 4.5 0 0 0 0 9h7"/><path d="M12 4.5 15.5 8 12 11.5"/></svg>
          </button>
        </div>
        <div id="edit-actions" class="tool-group" role="group" aria-label="Finish editing" hidden>
          <button id="edit-discard" class="tool-text" type="button" title="Throw the changes away" aria-label="Discard">Discard</button>
          <button id="edit-save" class="tool-text" type="button" title="Keep the changes for now" aria-label="Save">Save</button>
        </div>
      </div>
    </header>
    <p id="song-error" class="error" hidden></p>
    <div id="sheet-scroll">
      <!-- While editing, the textarea lies over the sheet. Its text is
           see-through and the sheet's letters and chords show through it. -->
      <div id="sheet-wrap">
        <article id="sheet"></article>
        <textarea id="sheet-editor" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Song text" hidden></textarea>
      </div>
    </div>
    <p id="persist-note" hidden>Changes do not persist</p>
    <div id="chord-live" class="visually-hidden" role="status" aria-live="polite"></div>
  </main>

  <div id="menu" class="menu" hidden>
    <button type="button" data-action="text">Copy song text</button>
    <button type="button" data-action="chords">Copy song text with chords</button>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- The chord entry of Edit chords: one text field. An anchored popover on a wide
       window, a sheet at the bottom of a narrow one. -->
  <div id="chord-entry" role="dialog" aria-label="Chord" hidden>
    <input id="chord-entry-field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Chord" aria-describedby="chord-entry-note">
    <p id="chord-entry-note"></p>
    <div class="chord-entry-buttons">
      <button type="button" id="chord-entry-cancel" class="tool-text">Cancel</button>
      <button type="button" id="chord-entry-ok" class="tool-text">OK</button>
    </div>
  </div>

  <dialog id="notice">
    <h2 id="notice-title"></h2>
    <p id="notice-message"></p>
    <form method="dialog"><button type="submit">OK</button></form>
  </dialog>

  <!-- Leaving Edit text or Edit chords (Back, another song), or a transpose that
       was not saved, with changes that nothing keeps asks first. Keep editing is
       the default. -->
  <dialog id="leave-confirm" aria-labelledby="leave-confirm-title">
    <h2 id="leave-confirm-title">Discard changes?</h2>
    <p>Your changes are not kept anywhere and will be lost.</p>
    <div class="leave-confirm-buttons">
      <button type="button" id="leave-confirm-discard" class="tool-text">Discard</button>
      <button type="button" id="leave-confirm-keep" class="tool-text" autofocus>Keep editing</button>
    </div>
  </dialog>

  <!-- Release version: every script and the style sheet below ends in ?v=.
       Change the date (in all of them) whenever you release a change to this
       folder, so a browser that kept an old index.html does not mix it with new
       scripts, or the other way round. sql-wasm.js never changes, so it has none. -->
  <script src="sql-wasm.js"></script>
  <script src="softchord_chords.js?v=2026-10-28d"></script>
  <script src="softchord_text.js?v=2026-10-28d"></script>
  <script src="softchord_text_edit.js?v=2026-10-28d"></script>
  <script src="softchord_chord_edit.js?v=2026-10-28d"></script>
  <script src="song_filter.js?v=2026-10-28d"></script>
  <script src="songbook.js?v=2026-10-28d"></script>
  <script src="softchord_zoom.js?v=2026-10-28d"></script>
  <script src="softchord_sheet_image.js?v=2026-10-28d"></script>
  <script src="softchord_chord_mode.js?v=2026-10-28d"></script>
  <script src="viewer.js?v=2026-10-28d"></script>
</body>
</html>
